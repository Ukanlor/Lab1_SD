
services:
  generador_respuestas:
    build: ./generador_respuestas
    container_name: generador_respuestas
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      FAIL_RATE: "0.0"
      MIN_DELAY: "0.0"
      MAX_DELAY: "0.0"

  servicio_metricas:
    build: ./servicio_metricas
    container_name: servicio_metricas
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - ./servicio_metricas:/app

  redis_cache:
    image: redis:latest
    container_name: redis_cache
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  servicio_cache:
    build: ./servicio_cache
    container_name: servicio_cache
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - redis_cache
      - generador_respuestas
      - servicio_metricas

  consumidor_kafka:
    build: ./consumidor_kafka
    depends_on:
      - servicio_cache
      - servicio_metricas
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MAIN_TOPIC: "queries"
      RETRY_TOPIC: "retry-queries"
      DLQ_TOPIC: "dead-letter-queue"
      GROUP_ID: "query-processors"
      CACHE_URL: "http://servicio_cache:8001"
      METRICS_URL: "http://servicio_metricas:8002"
      MAX_RETRIES: "3"
      BASE_RETRY_DELAY: "5"

  generador_trafico:
    build: ./generador_trafico
    environment:
      MODE: "kafka"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      TOPIC: "queries"
      DISTRIBUTION: "uniforme"
      NUM_PETICIONES: "500"
      RATE: "50"
      SCENARIO: "default"
  
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"